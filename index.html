<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gira de Estudio Camboriú 2027 • IV° Medio A - Colegio Altazor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka', sans-serif;
    }

    /* Contenedor maestro estricto 900x1700 adaptado a 1 sola pantalla */
    .canvas-wrapper {
      position: relative;
      height: 100dvh;
      max-height: 100dvh;
      aspect-ratio: 900 / 1700;
      width: auto;
      max-width: 100vw;
      background-color: #ffffff;
      background-image: url('fondo.jpg');
      background-size: 100% 100%;
      background-position: center center;
      background-repeat: no-repeat;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.08);
    }

    /* ==========================================
       EFECTO 1: DESTELLO EN LENTES + BURBUJAS DE COCO
       ========================================== */
    .polar-sunglasses-glint {
      position: absolute;
      top: 4.9%;
      left: 14.5%;
      width: 13.5%;
      height: 2.3%;
      border-radius: 999px;
      pointer-events: none;
      z-index: 12;
      overflow: hidden;
      transform: rotate(-10deg);
    }

    .polar-sunglasses-glint::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -80%;
      width: 45%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
      transform: skewX(-25deg);
      animation: glint-sweep 4.2s ease-in-out infinite;
    }

    @keyframes glint-sweep {
      0%, 68% { left: -80%; opacity: 0; }
      75% { opacity: 1; }
      92% { left: 140%; opacity: 0.9; }
      100% { left: 140%; opacity: 0; }
    }

    .coco-bubbles-layer {
      position: absolute;
      top: 3%;
      left: 22%;
      width: 12%;
      height: 10%;
      pointer-events: none;
      z-index: 12;
    }

    .coco-bubble {
      position: absolute;
      bottom: 10%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), rgba(114, 239, 221, 0.55));
      border: 1px solid rgba(255, 255, 255, 0.8);
      opacity: 0;
      animation: float-bubble 3.6s ease-in infinite;
    }

    .coco-bubble:nth-child(1) { left: 20%; width: 9px; height: 9px; animation-delay: 0s; }
    .coco-bubble:nth-child(2) { left: 48%; width: 6px; height: 6px; animation-delay: 1.2s; }
    .coco-bubble:nth-child(3) { left: 72%; width: 11px; height: 11px; animation-delay: 2.3s; }

    .coco-note {
      position: absolute;
      bottom: 15%;
      left: 42%;
      font-size: clamp(13px, 1.8dvh, 22px);
      color: #009c3b;
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.9);
      opacity: 0;
      pointer-events: none;
    }

    .canvas-wrapper.music-active .coco-note {
      animation: float-note 2.6s ease-out infinite;
    }

    .canvas-wrapper.music-active .coco-note.n2 {
      left: 65%;
      color: #0077b6;
      animation-delay: 1.3s;
    }

    @keyframes float-bubble {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      25% { opacity: 0.85; }
      100% { transform: translateY(-48px) translateX(8px) scale(1.15); opacity: 0; }
    }

    @keyframes float-note {
      0% { transform: translateY(0) rotate(-10deg) scale(0.7); opacity: 0; }
      25% { opacity: 1; }
      100% { transform: translateY(-65px) rotate(18deg) scale(1.15); opacity: 0; }
    }

    /* ==========================================
       EFECTO 2: BRISA TROPICAL Y PARTÍCULAS LATERALES
       ========================================== */
    .ambient-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      overflow: hidden;
    }

    .sun-sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffdf00 0%, rgba(255, 223, 0, 0) 70%);
      opacity: 0;
      animation: sparkle-twinkle 4s ease-in-out infinite;
    }

    .leaf-drift {
      position: absolute;
      font-size: clamp(14px, 2dvh, 24px);
      opacity: 0.55;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.12));
      animation: leaf-sway 9s ease-in-out infinite;
    }

    @keyframes sparkle-twinkle {
      0%, 100% { transform: scale(0.4); opacity: 0; }
      50% { transform: scale(1.4); opacity: 0.85; }
    }

    @keyframes leaf-sway {
      0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; }
      15% { opacity: 0.6; }
      50% { transform: translate(14px, 45px) rotate(22deg); }
      85% { opacity: 0.5; }
      100% { transform: translate(-6px, 105px) rotate(-12deg); opacity: 0; }
    }

    /* ==========================================
       EFECTO 3: EASTER EGG INTERACTIVO EN POLAR
       ========================================== */
    .polar-hotspot {
      position: absolute;
      top: 3.5%;
      left: 5%;
      width: 31%;
      height: 19%;
      z-index: 22;
      cursor: pointer;
      border-radius: 28px;
    }

    .polar-speech-bubble {
      position: absolute;
      top: 19.5%;
      left: 5%;
      max-width: 58%;
      z-index: 30;
      background: #ffffff;
      color: #102a43;
      border: 3px solid #102a43;
      border-radius: 18px;
      padding: 0.5em 0.8em;
      font-size: clamp(11px, 1.55dvh, 18px);
      font-weight: 700;
      box-shadow: 0 6px 0 #102a43, 0 10px 18px rgba(0, 0, 0, 0.22);
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scale(0.9);
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .polar-speech-bubble::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 24px;
      border-width: 0 9px 10px 9px;
      border-style: solid;
      border-color: transparent transparent #102a43 transparent;
    }

    .polar-speech-bubble::after {
      content: '';
      position: absolute;
      top: -6px;
      left: 26px;
      border-width: 0 7px 8px 7px;
      border-style: solid;
      border-color: transparent transparent #ffffff transparent;
    }

    .polar-speech-bubble.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .burst-emoji {
      position: absolute;
      z-index: 35;
      font-size: clamp(18px, 2.5dvh, 28px);
      pointer-events: none;
      animation: burst-fly 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes burst-fly {
      0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(var(--rot)); opacity: 0; }
    }

    /* Botón de Música Circular y Compacto */
    .music-btn {
      position: absolute;
      top: 15.2%;
      right: 4.5%;
      z-index: 25;
      width: clamp(34px, 4.4dvh, 52px);
      height: clamp(34px, 4.4dvh, 52px);
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      background: linear-gradient(135deg, #009c3b 0%, #0077b6 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 55, 95, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.45);
      transition: transform 0.2s ease, background 0.3s ease, box-shadow 0.2s ease;
      animation: pulse-soft 2.4s infinite;
    }

    .music-btn:hover {
      transform: scale(1.08);
    }

    .music-btn:active {
      transform: scale(0.92);
    }

    .music-btn.playing {
      background: linear-gradient(135deg, #ffdf00 0%, #f77f00 100%);
      color: #102a43;
      border-color: #102a43;
      animation: none;
    }

    .music-btn svg {
      width: 54%;
      height: 54%;
      fill: currentColor;
      display: block;
    }

    .music-btn.playing svg {
      animation: note-bounce 1.2s ease-in-out infinite;
    }
